# Nginx configuration for highcon.in (Ubuntu + CloudPanel)
#
# IMPORTANT: Do NOT use "try_files $uri $uri/ ..." with $uri/ in the middle.
# When a folder exists without index.html, nginx returns 403 and never reaches SPA fallback.

server {
    listen 80;
    listen [::]:80;
    server_name highcon.in www.highcon.in;

    root /home/cloudpanel/htdocs/highcon.in;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml application/xml;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff|woff2|ico|xml|txt)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Prerendered /path/index.html first, then SPA fallback — never stop on bare directories
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
    }

    location = /robots.txt {
        try_files /robots.txt =404;
    }
}

# CloudPanel: Site → Vhost → paste into "vhost.d" or replace location / block:
#
#   location / {
#       try_files $uri $uri/index.html /index.html;
#   }
